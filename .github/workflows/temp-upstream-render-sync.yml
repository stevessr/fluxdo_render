name: Temporary upstream render sync

on:
  push:
    branches:
      - sync/upstream-20260905

permissions:
  contents: write

jobs:
  merge:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Merge upstream paragraph lifetime fix with fork layout fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/Lingyan000/fluxdo_render.git
          git fetch upstream main

          set +e
          git merge --no-ff --no-commit upstream/main
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "Unexpected clean merge; keeping it."
          else
            conflicts=$(git diff --name-only --diff-filter=U)
            if [ "$conflicts" != "lib/src/render/cached_paragraph_text.dart" ]; then
              echo "Unexpected conflicts:" >&2
              printf '%s\n' "$conflicts" >&2
              exit 1
            fi
            git checkout --ours -- lib/src/render/cached_paragraph_text.dart

            python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/src/render/cached_paragraph_text.dart')
          text = p.read_text()

          # 保留 fork 的 infinity-width / intrinsic 修复，只叠加上游 native
          # Paragraph 生命周期修复，避免 LRU 淘汰仍在屏条目导致 UAF。
          old = '  void dispose() => paragraph.dispose();\n'
          new = '''  /// 在屏 RenderObject 的持有计数。LRU 淘汰不能直接释放仍在 paint 的\n  /// native Paragraph，否则下一帧可能触发 use-after-free。\n  int _refCount = 0;\n  bool _pendingDispose = false;\n  bool _disposed = false;\n\n  bool get isDisposed => _disposed;\n\n  void retain() {\n    _refCount++;\n  }\n\n  void release() {\n    if (_refCount > 0) _refCount--;\n    _disposeIfIdle();\n  }\n\n  void requestDispose() {\n    _pendingDispose = true;\n    _disposeIfIdle();\n  }\n\n  void _disposeIfIdle() {\n    if (_disposed || !_pendingDispose || _refCount > 0) return;\n    _disposed = true;\n    paragraph.dispose();\n  }\n'''
          if old not in text:
            raise SystemExit('ParagraphLayoutEntry dispose marker missing')
          text = text.replace(old, new, 1)

          text = text.replace(
              '      _entries.remove(oldest)!.dispose();\n',
              '      // 仍在屏的条目延迟到最后一个 RenderObject release 后再释放。\n      _entries.remove(oldest)!.requestDispose();\n', 1)
          text = text.replace(
              '      e.dispose();\n',
              '      e.requestDispose();\n', 1)

          # result/env 改变时必须释放旧条目的持有权。
          # 这里只替换两个 setter 中的 `_entry = null`，其它逻辑保持 fork 版本。
          if text.count('    _entry = null;\n') < 2:
            raise SystemExit('RenderCachedParagraph setter markers missing')
          text = text.replace('    _entry = null;\n', '    _releaseEntry();\n', 2)

          field = '  ParagraphLayoutEntry? _entry;\n  String? _cachedPlainText;\n'
          helper = '''  ParagraphLayoutEntry? _entry;\n  String? _cachedPlainText;\n\n  void _releaseEntry() {\n    _entry?.release();\n    _entry = null;\n  }\n\n  @override\n  void dispose() {\n    _releaseEntry();\n    super.dispose();\n  }\n'''
          if field not in text:
            raise SystemExit('entry field marker missing')
          text = text.replace(field, helper, 1)

          old_layout = '''    final entry = _entry = ParagraphLayoutCache.obtain(\n      _result,\n      _env,\n      constraints.minWidth,\n      constraints.maxWidth,\n    );\n'''
          new_layout = '''    final obtained = ParagraphLayoutCache.obtain(\n      _result,\n      _env,\n      constraints.minWidth,\n      constraints.maxWidth,\n    );\n    // 先 retain 新条目再 release 旧条目；命中同一条时不能让引用瞬间归零。\n    if (!identical(obtained, _entry)) {\n      obtained.retain();\n      _entry?.release();\n      _entry = obtained;\n    }\n    final entry = obtained;\n'''
          if old_layout not in text:
            raise SystemExit('performLayout marker missing')
          text = text.replace(old_layout, new_layout, 1)
          p.write_text(text)
          PY
            git add lib/src/render/cached_paragraph_text.dart
          fi

          rm -f .github/workflows/temp-upstream-render-sync.yml
          git add -A
          git commit -m "merge: sync upstream paragraph cache lifetime fix"
          git push origin HEAD:sync/upstream-20260905
